<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vision, Voice and Vantage — vantage content</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #0b0b0d; font-family: 'Inter', sans-serif; color: #f5f3f0; overflow-x: hidden; }

    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem clamp(1.5rem, 4vw, 3rem);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(11, 11, 13, 0.82);
      backdrop-filter: blur(10px);
    }
    .site-header__logo {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f5f3f0;
      text-decoration: none;
    }
    .site-header__nav {
      display: flex;
      align-items: center;
      gap: 1.75rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-size: 0.8rem;
    }
    .site-header__nav a {
      color: rgba(245, 243, 240, 0.9);
      text-decoration: none;
    }
    .site-header__nav a:hover {
      color: #fff;
    }
    .site-header__nav .header-cta {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }
    .site-header__nav .header-cta:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    @media (max-width: 640px) {
      .site-header__nav { gap: 1rem; font-size: 0.75rem; }
      .site-header__nav a { padding: 0.5rem 0; min-height: 44px; display: inline-flex; align-items: center; }
      .site-header__nav .header-cta { min-height: 44px; padding: 0.6rem 1rem; display: inline-flex; align-items: center; justify-content: center; }
    }
    @media (max-width: 480px) {
      .landing-hero-tagline__word { font-size: clamp(2.5rem, 14vw, 4rem); }
      .landing-hero-tagline { padding: clamp(2rem, 8vw, 4rem); }
    }

    .landing-hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .landing-hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 75% 20%, rgba(99, 102, 241, 0.25), rgba(99, 102, 241, 0) 42%),
        radial-gradient(circle at 15% 80%, rgba(128, 131, 255, 0.2), rgba(128, 131, 255, 0) 48%),
        #131313;
    }
    .landing-hero-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        to bottom,
        rgba(10, 10, 12, 0.25) 0%,
        rgba(10, 10, 12, 0.6) 55%,
        rgba(10, 10, 12, 0.9) 100%
      );
      pointer-events: none;
    }
    .landing-hero-tagline {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: clamp(4rem, 12vw, 10rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .landing-kicker {
      margin-bottom: 0.85rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 0.72rem;
      color: #c0c1ff;
    }
    .landing-sub {
      margin-top: 1.25rem;
      max-width: 52rem;
      color: rgba(245,243,240,0.9);
      font-size: 1rem;
      line-height: 1.6;
      text-align: center;
    }
    .landing-sub strong { color: #fff; font-weight: 700; }
    .landing-hero-tagline__words {
      position: relative;
      min-height: 5em;
      width: 100%;
    }
    .landing-hero-tagline__word {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 800;
      font-size: clamp(5.25rem, 10.5vw, 7.875rem);
      letter-spacing: 0.02em;
      line-height: 1.12;
      color: #ffffff;
      text-shadow: 0 12px 40px rgba(0,0,0,0.42);
      white-space: nowrap;
      opacity: 0;
    }
    .landing-hero-tagline__word--vantage {
      background: linear-gradient(90deg, #c0c1ff, #8083ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: none;
    }
    .landing-hero-tagline__word--vision {
      animation: word-in 0.5s ease 0.5s forwards, word-out 0.3s ease 1.2s forwards;
    }
    .landing-hero-tagline__word--voice {
      animation: word-in 0.5s ease 1.3s forwards, word-out 0.3s ease 2s forwards;
    }
    .landing-hero-tagline__word--vantage {
      animation: word-in 0.5s ease 2.1s forwards;
    }
    .landing-hero-enter {
      display: inline-block;
      margin-top: 2.5rem;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(229, 226, 225, 0.9);
      text-decoration: none;
      border-bottom: 1px solid rgba(229, 226, 225, 0.6);
      padding-bottom: 0.25rem;
    }
    .landing-hero-enter:hover {
      color: #fff;
      border-bottom-color: #fff;
    }
    @keyframes word-in {
      to { opacity: 1; }
    }
    @keyframes word-out {
      to { opacity: 0; }
    }
  
    .whatsapp-quick-link {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 120;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      border-radius: 9999px;
      padding: 0.72rem 1rem;
      background: #25D366;
      color: #ffffff;
      text-decoration: none;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .whatsapp-quick-link:hover {
      background: #1fb85a;
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.28);
      color: #ffffff;
    }
    .whatsapp-quick-link svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    @media (max-width: 640px) {
      .whatsapp-quick-link {
        right: 0.75rem;
        bottom: 0.75rem;
        padding: 0.68rem 0.9rem;
        font-size: 0.72rem;
      }
    }

  </style>
</head>
<body>
  <header class="site-header">
    <a href="/home" class="site-header__logo">vantage content</a>
  </header>

  <section class="landing-hero">
    <div class="landing-hero-bg"></div>
    <div class="landing-hero-overlay" aria-hidden="true"></div>
    <div class="landing-hero-tagline">
      <span class="landing-kicker">The digital frontier</span>
      <div class="landing-hero-tagline__words">
        <span class="landing-hero-tagline__word landing-hero-tagline__word--vision" aria-hidden="true">Vision</span>
        <span class="landing-hero-tagline__word landing-hero-tagline__word--voice" aria-hidden="true">Voice</span>
        <span class="landing-hero-tagline__word landing-hero-tagline__word--vantage" aria-hidden="true">Vantage</span>
      </div>
      <a href="/home" class="landing-hero-enter">Enter</a>
    </div>
  </section>

    <span>
      VANTAGE CONTENT B.V.<br />

      1017 CA Amsterdam
    </span>
    <span style="display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-end;">
      <a href="/privacy-policy" style="color: inherit; text-decoration: underline; text-underline-offset: 2px;">Privacy policy</a>
      <a href="/cookie-policy" style="color: inherit; text-decoration: underline; text-underline-offset: 2px;">Cookie policy</a>
      <button type="button" data-vantage-cookie-settings style="background: none; border: none; padding: 0; font: inherit; color: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer;">Cookie settings</button>
      <a href="mailto:markammand@vantagecontent.com" style="color: inherit; text-decoration: underline; text-underline-offset: 2px;">
        Email us

  </footer>
  <script src="/js/eu-cookie-consent.js" defer></script>

</body>
</html>
